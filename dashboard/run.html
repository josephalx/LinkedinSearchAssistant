<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Run scraper / matcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='600' fill='%235b8dee' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0b0d10;
    --surface: #14171b;
    --border: #23262b;
    --border-strong: #33373d;
    --text: #e6e4df;
    --text-dim: #8b9099;
    --text-faint: #565b62;
    --accent: #5b8dee;
    --good: #34d399;
    --mid: #f5a524;
    --bad: #f4574e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1.5rem 4rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .nav { margin-bottom: 1.5rem; }
  .nav a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
  }
  .nav a:hover { text-decoration: underline; }
  /* Outlined pill, mirroring the "Run scraper" control on dashboard.html. */
  .nav a.back-link {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: inherit;
    font-size: 14px; font-weight: 500;
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .nav a.back-link:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    text-decoration: none;
  }
  .prompt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--text-faint);
    margin: 0 0 4px;
  }
  .prompt .cursor { color: var(--accent); }
  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 2rem;
  }
  h2 {
    font-size: 16px; font-weight: 500;
    margin: 0 0 1rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }
  section:first-of-type h2 { border-top: none; padding-top: 0; }
  .run-section {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  /* Pill buttons, matching dashboard.html: filled background with dark --bg
     text, so the label always reads against the fill. */
  .run-btn {
    font-family: inherit; font-size: 15px; font-weight: 500;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .run-btn:hover:not(:disabled) { opacity: 0.85; }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* --text, not --accent: an accent ring on an accent fill is invisible. */
  .run-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .run-btn.stop-btn { background: var(--bad); }
  .run-indicator { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .run-indicator.active { color: var(--mid); }
  .chip {
    display: inline-flex; align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--good);
    border: 1px solid var(--good);
    border-radius: 12px;
    padding: 2px 10px;
  }
  .chip.pending-chip { color: var(--accent); border-color: var(--accent); }
  .log-panel {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 16px;
    height: 45vh;
    min-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log-panel::-webkit-scrollbar { width: 10px; }
  .log-panel::-webkit-scrollbar-track { background: transparent; }
  .log-panel::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
  .log-panel::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .log-panel { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  .log-header { color: var(--accent); font-weight: 500; }
  .log-ok { color: var(--good); }
  .log-warn { color: var(--mid); }
  .log-plain { color: var(--text-dim); }
  @media (max-width: 640px) {
    body { padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 22px; }
    .log-panel { height: 40vh; min-height: 200px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="nav"><a href="dashboard.html" class="back-link">
    <svg viewBox="0 0 16 16" width="12" height="12" fill="none" aria-hidden="true"><path d="M9.5 3.5L5 8l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to dashboard</a></p>
  <p class="prompt">job-match-dashboard <span class="cursor">$</span> ./run</p>
  <h1>Run scraper / matcher</h1>

  <section>
    <h2>Scraper</h2>
    <div class="run-section">
      <button class="run-btn" id="scraper-run">Run scraper</button>
      <button class="run-btn stop-btn" id="scraper-stop" disabled>Stop</button>
      <span class="run-indicator" id="scraper-indicator"></span>
    </div>
    <pre class="log-panel" id="scraper-log"></pre>
  </section>

  <section>
    <h2>Matcher</h2>
    <div class="run-section">
      <button class="run-btn" id="matcher-run">Run matcher</button>
      <button class="run-btn stop-btn" id="matcher-stop" disabled>Stop</button>
      <span class="run-indicator" id="matcher-indicator"></span>
      <span class="chip pending-chip" id="matcher-pending-chip">... pending</span>
    </div>
    <pre class="log-panel" id="matcher-log"></pre>
  </section>
</div>

<script>
const API_BASE = "http://josephs-macbook-pro.local:5050";

function getToken() {
  let token = localStorage.getItem("dashboard_token");
  if (!token) {
    token = prompt("Enter dashboard token (set on the Mac via keyring):");
    if (token) localStorage.setItem("dashboard_token", token);
  }
  return token;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function classifyLine(line) {
  if (/^===|^---/.test(line)) return "log-header";
  if (/skipped|error|failed|excluded/i.test(line)) return "log-warn";
  if (/parsed \(|^\[\d/.test(line)) return "log-ok";
  return "log-plain";
}

const socket = io(API_BASE);

function setupRunner(name, opts) {
  opts = opts || {};
  const runBtn = document.getElementById(name + "-run");
  const stopBtn = document.getElementById(name + "-stop");
  const indicator = document.getElementById(name + "-indicator");
  const logPanel = document.getElementById(name + "-log");
  const pendingChip = opts.pendingChipId ? document.getElementById(opts.pendingChipId) : null;
  let pendingCount = null;

  async function refreshPendingCount() {
    if (!pendingChip) return;
    try {
      const resp = await fetch(API_BASE + "/api/pending-count");
      const data = await resp.json();
      pendingCount = data.pending;
      pendingChip.textContent = pendingCount + " pending";
    } catch (e) {
      pendingChip.textContent = "pending: unknown";
    }
  }

  function appendLine(line) {
    const cls = classifyLine(line);
    logPanel.insertAdjacentHTML("beforeend", '<span class="' + cls + '">' + escapeHtml(line) + "</span>");
  }

  function appendLog(line) {
    logPanel.style.display = "block";
    appendLine(line);
    logPanel.scrollTop = logPanel.scrollHeight;

    // A job was handled (scored or clearance-excluded) this run — reflect
    // that immediately in the pending count, even before the run finishes.
    // In dry-run mode nothing is actually saved to the DB, so this is only
    // a live "progress through this run" estimate — refreshPendingCount()
    // re-syncs to the real DB value once the run completes either way.
    if (pendingChip && pendingCount !== null && (/^\[\d+%\]/.test(line) || /^\[excluded\]/.test(line))) {
      pendingCount = Math.max(0, pendingCount - 1);
      pendingChip.textContent = pendingCount + " pending";
    }
  }

  async function loadExistingLog() {
    try {
      const resp = await fetch(API_BASE + "/api/logs/" + name);
      const text = await resp.text();
      if (text && text !== "no log yet") {
        logPanel.innerHTML = "";
        text.split("\n").forEach((line, i, arr) => {
          appendLine(i < arr.length - 1 ? line + "\n" : line);
        });
        logPanel.style.display = "block";
        logPanel.scrollTop = logPanel.scrollHeight;
      }
    } catch (e) { /* ignore — page still works without this */ }
  }

  function setRunning(isRunning) {
    runBtn.disabled = isRunning;
    stopBtn.disabled = !isRunning;
    if (isRunning) {
      indicator.textContent = "running...";
      indicator.classList.add("active");
    }
  }

  socket.on(name + "_log", (data) => appendLog(data.line));
  socket.on(name + "_done", (data) => {
    indicator.textContent = "finished (exit code " + data.returncode + ")";
    indicator.classList.remove("active");
    runBtn.disabled = false;
    stopBtn.disabled = true;
    refreshPendingCount();
  });

  runBtn.addEventListener("click", async () => {
    const token = getToken();
    if (!token) return;
    logPanel.innerHTML = "";
    setRunning(true);
    indicator.textContent = "starting...";
    try {
      const resp = await fetch(API_BASE + "/api/run-" + name, {
        method: "POST",
        headers: { "X-API-Token": token },
      });
      if (resp.status === 401) {
        localStorage.removeItem("dashboard_token");
        alert("Token rejected — try again.");
        setRunning(false);
        indicator.textContent = "";
        return;
      }
      if (resp.status === 409) {
        indicator.textContent = "already running";
        return;
      }
      indicator.textContent = "running...";
    } catch (e) {
      indicator.textContent = "failed to start: " + e.message;
      indicator.classList.remove("active");
      setRunning(false);
    }
  });

  stopBtn.addEventListener("click", async () => {
    const token = getToken();
    if (!token) return;
    stopBtn.disabled = true;
    indicator.textContent = "stopping...";
    try {
      const resp = await fetch(API_BASE + "/api/stop-" + name, {
        method: "POST",
        headers: { "X-API-Token": token },
      });
      if (resp.status === 401) {
        localStorage.removeItem("dashboard_token");
        alert("Token rejected — try again.");
        stopBtn.disabled = false;
        return;
      }
      if (resp.status === 409) {
        indicator.textContent = "nothing running";
        return;
      }
      // the "_done" event fires once the process actually exits
    } catch (e) {
      indicator.textContent = "failed to stop: " + e.message;
    }
  });

  return { loadExistingLog, setRunning, refreshPendingCount };
}

async function checkRunStatus(name, runner) {
  try {
    const resp = await fetch(API_BASE + "/api/run-status");
    const data = await resp.json();
    if (data[name + "_running"]) runner.setRunning(true);
  } catch (e) { /* ignore */ }
}

const scraperRunner = setupRunner("scraper");
const matcherRunner = setupRunner("matcher", { pendingChipId: "matcher-pending-chip" });

scraperRunner.loadExistingLog();
matcherRunner.loadExistingLog();
matcherRunner.refreshPendingCount();
checkRunStatus("scraper", scraperRunner);
checkRunStatus("matcher", matcherRunner);
</script>
</body>
</html>
