<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Job match dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='19' font-weight='600' fill='%235b8dee' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --surface: #14171b;
    --border: #23262b;
    --border-strong: #33373d;
    --text: #e6e4df;
    --text-dim: #8b9099;
    --text-faint: #565b62;
    --accent: #5b8dee;
    --good: #34d399;
    --mid: #f5a524;
    --bad: #f4574e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1.5rem 4rem;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .nav { margin-bottom: 1rem; }
  .nav a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
  }
  .nav a:hover { text-decoration: underline; }
  .prompt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--text-faint);
    margin: 0 0 4px;
  }
  .prompt .cursor { color: var(--accent); }
  h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0 0 1.5rem;
  }
  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 1.5rem;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
  }
  .stat-card { background: var(--surface); padding: 1.1rem 1.25rem; }
  .stat-label { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 500; }
  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 1rem;
  }
  input[type=text], select {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 4px;
  }
  input[type=text]:focus-visible, select:focus-visible, button:focus-visible, input[type=range]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input[type=text] { flex: 1; min-width: 160px; }
  select { width: 190px; }
  .refresh-btn {
    font-family: inherit; font-size: 15px;
    padding: 10px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--accent); }
  .range-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 1.5rem;
    font-size: 15px; color: var(--text-dim);
  }
  input[type=range] {
    flex: 1; accent-color: var(--accent);
  }
  .range-row .val {
    font-family: 'IBM Plex Mono', monospace;
    min-width: 34px; color: var(--text);
  }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  thead th {
    text-align: left; font-weight: 500; color: var(--text-dim);
    font-size: 13px; padding: 10px;
    border-bottom: 1px solid var(--border-strong);
    cursor: pointer; white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  tbody tr.job-row {
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }
  tbody tr.job-row:hover { background: var(--surface); }
  tbody td { padding: 12px 10px; vertical-align: top; }
  .score-cell { display: flex; align-items: center; gap: 8px; }
  .score-bar { width: 3px; height: 18px; border-radius: 1px; flex-shrink: 0; }
  .score-num { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .company { color: var(--text-dim); }
  .resume-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; color: var(--text-faint);
  }
  .detail-row td {
    background: var(--surface);
    font-size: 15px; color: var(--text-dim);
    padding: 14px 10px 18px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row .label { color: var(--text); font-weight: 500; }
  .detail-row a { color: var(--accent); text-decoration: none; }
  .detail-row a:hover { text-decoration: underline; }
  .applied-btn {
    font-family: inherit; font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    margin-top: 10px;
  }
  .applied-btn:hover { border-color: var(--accent); }
  .copy-btn {
    font-family: inherit; font-size: 13px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    margin-left: 8px;
  }
  .copy-btn:hover { border-color: var(--accent); }
  .copy-btn.copied { border-color: var(--good); color: var(--good); }
  .show-applied {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; color: var(--text-dim);
  }
  .show-applied input { accent-color: var(--accent); }
  @media (max-width: 640px) {
    body { padding: 1.25rem 1rem 3rem; }
    thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .prompt { font-size: 13px; }
    h1 { font-size: 20px; }
    #status { font-size: 12px; }
    .stat-label { font-size: 12px; }
    .stat-value { font-size: 26px; }
    input[type=text], select, .refresh-btn { font-size: 13px; padding: 9px 10px; }
    .range-row { font-size: 13px; }
    table { font-size: 13px; }
    thead th { font-size: 12px; padding: 8px 10px; }
    tbody td { padding: 10px; }
    .resume-tag { font-size: 11px; }
    .detail-row td { font-size: 13px; padding: 12px 10px 16px; }
    .show-applied { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="prompt">job-match-dashboard <span class="cursor">$</span> tail -f matches</p>
  <h1>Job match dashboard</h1>
  <p class="nav"><a href="run.html">run scraper &rarr;</a></p>
  <div id="status">connecting...</div>
  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search title or company" />
    <select id="resumeFilter">
      <option value="all">All resumes</option>
      <option value="software_engineering_v1">Software engineering</option>
      <option value="mobile_v1">Mobile</option>
      <option value="excluded_clearance">Excluded (clearance)</option>
    </select>
    <label class="show-applied"><input type="checkbox" id="showApplied" /> Show applied</label>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>

  <div class="range-row">
    <label for="minScore">Min score</label>
    <input type="range" min="0" max="100" step="5" value="0" id="minScore" />
    <span class="val" id="minScoreOut">0</span>
  </div>

  <table>
    <thead>
      <tr>
        <th data-sort="score">Score</th>
        <th data-sort="title">Title</th>
        <th data-sort="company">Company</th>
        <th>Resume</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const API_URL = "http://josephs-macbook-pro.local:5050/api/matches";
let DATA = [];
let sortKey = "score";
let sortDir = -1;
let expanded = new Set();

function resumeLabel(v) {
  if (v === "software_engineering_v1") return "swe";
  if (v === "mobile_v1") return "mobile";
  if (v === "excluded_clearance") return "excluded";
  return v;
}

function scoreTier(s) {
  if (s >= 70) return { bar: "var(--good)", text: "var(--good)" };
  if (s >= 40) return { bar: "var(--mid)", text: "var(--mid)" };
  return { bar: "var(--bad)", text: "var(--bad)" };
}

async function loadData() {
  document.getElementById("status").textContent = "connecting...";
  try {
    const resp = await fetch(API_URL);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    DATA = await resp.json();
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    document.getElementById("status").textContent = DATA.length + " matches loaded \u00b7 updated " + t;
    render();
  } catch (e) {
    document.getElementById("status").textContent =
      "could not reach api at " + API_URL + " \u2014 is api.py running? (" + e.message + ")";
  }
}

function getFiltered() {
  const q = document.getElementById("search").value.toLowerCase();
  const resumeVal = document.getElementById("resumeFilter").value;
  const minScore = parseInt(document.getElementById("minScore").value, 10);
  const showApplied = document.getElementById("showApplied").checked;
  return DATA.filter(d => {
    if (!showApplied && d.applied) return false;
    if (resumeVal !== "all" && d.resume_version !== resumeVal) return false;
    if (d.score < minScore) return false;
    if (q && !(d.title.toLowerCase().includes(q) || d.company.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === "string") { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });
}

function renderStats(filtered) {
  const total = filtered.length;
  const avg = total ? Math.round(filtered.reduce((a, d) => a + d.score, 0) / total) : 0;
  const matches = filtered.filter(d => d.score >= 70).length;
  const excluded = filtered.filter(d => d.resume_version === "excluded_clearance").length;
  const stats = [
    { label: "total", value: total },
    { label: "avg score", value: avg + "%" },
    { label: "matches \u2265 70", value: matches },
    { label: "excluded", value: excluded },
  ];
  document.getElementById("stats").innerHTML = stats.map(s =>
    '<div class="stat-card"><div class="stat-label">' + s.label + '</div><div class="stat-value">' + s.value + '</div></div>'
  ).join("");
}

async function toggleApplied(jobId, applied) {
  try {
    await fetch(API_URL + "/" + jobId + "/applied", { method: applied ? "POST" : "DELETE" });
    const entry = DATA.find(d => d.job_id === jobId);
    if (entry) entry.applied = applied;
    render();
  } catch (e) {
    document.getElementById("status").textContent = "could not update applied status: " + e.message;
  }
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);

  document.getElementById("tbody").innerHTML = filtered.map((d, i) => {
    const t = scoreTier(d.score);
    const isOpen = expanded.has(i);
    let rows = '<tr class="job-row" data-idx="' + i + '">' +
      '<td><div class="score-cell"><span class="score-bar" style="background:' + t.bar + '"></span>' +
      '<span class="score-num" style="color:' + t.text + '">' + d.score + '%</span></div></td>' +
      '<td>' + d.title + '</td>' +
      '<td class="company">' + d.company + '</td>' +
      '<td><span class="resume-tag">' + resumeLabel(d.resume_version) + '</span></td>' +
      '</tr>';
    if (isOpen) {
      rows += '<tr class="detail-row"><td colspan="4">' +
        '<div><span class="label">' + d.title + '</span>' +
        '<button class="copy-btn" data-copy-text="' + d.title.replace(/"/g, '&quot;') + '">copy title</button></div>' +
        '<div style="margin-top:6px;"><span class="label">missing:</span> ' + (d.missing_skills || "none listed") + '</div>' +
        '<div style="margin-top:6px;">' + d.reasoning + '</div>' +
        '<div style="margin-top:6px;"><a href="' + d.url + '" target="_blank">view posting \u2192</a></div>' +
        '<button class="applied-btn" data-job-id="' + d.job_id + '" data-applied="' + (!d.applied) + '">' +
        (d.applied ? "mark not applied" : "mark applied") + '</button>' +
        '</td></tr>';
    }
    return rows;
  }).join("");

  document.querySelectorAll("tr.job-row").forEach(row => {
    row.addEventListener("click", () => {
      const idx = parseInt(row.getAttribute("data-idx"), 10);
      if (expanded.has(idx)) expanded.delete(idx); else expanded.add(idx);
      render();
    });
  });

  document.querySelectorAll(".applied-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const jobId = btn.getAttribute("data-job-id");
      const applied = btn.getAttribute("data-applied") === "true";
      toggleApplied(jobId, applied);
    });
  });

  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const text = btn.getAttribute("data-copy-text");
      try {
        await navigator.clipboard.writeText(text);
        const original = btn.textContent;
        btn.textContent = "copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove("copied");
        }, 1200);
      } catch (err) {
        btn.textContent = "copy failed";
      }
    });
  });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("resumeFilter").addEventListener("change", render);
document.getElementById("showApplied").addEventListener("change", render);
document.getElementById("minScore").addEventListener("input", e => {
  document.getElementById("minScoreOut").textContent = e.target.value;
  render();
});
document.getElementById("refreshBtn").addEventListener("click", loadData);
document.querySelectorAll("th[data-sort]").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.getAttribute("data-sort");
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    render();
  });
});

loadData();
</script>
</body>
</html>
